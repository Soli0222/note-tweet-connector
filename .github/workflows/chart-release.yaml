name: Publish Helm Chart

# chart 単独の変更 (renovate の third-party image 追従など) と、定期的な調停の
# 起動経路。アプリのリリース経由の chart publish は release.yaml の DAG が行う。

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  schedule:
    # 毎日 04:17 JST。run が欠落しても次の reconcile が拾えるようにする。
    - cron: '17 19 * * *'
  workflow_dispatch:

jobs:
  # release-please の PR には Chart.yaml の appVersion 更新が含まれ、そのマージで
  # GitHub Release 作成より前に charts/** の push trigger が発火する。これが
  # 順序逆転の正体なので、appVersion だけの変更では publish を起動しない。
  # その変更は release.yaml の DAG が image 成功後に処理する。
  triage:
    name: Triage the push
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.triage.outputs.run }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to reconcile
        id: triage
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" != push ]]; then
            echo "${EVENT} は常に reconcile する"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "before (${BEFORE}) を解決できないので reconcile する"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$BEFORE" "$AFTER" -- charts)
          printf 'changed under charts/:\n'; printf '  %s\n' "${changed[@]}"

          # charts/ 直下で変わったのが Chart.yaml だけで、しかもその変更行が
          # appVersion だけなら、release.yaml 側に任せて何もしない。
          if [[ ${#changed[@]} -eq 1 && "${changed[0]}" =~ ^charts/[^/]+/Chart\.yaml$ ]]; then
            others=$(
              git diff -U0 "$BEFORE" "$AFTER" -- "${changed[0]}" \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                | sed 's/^.//' \
                | grep -vE '^\s*$' \
                | grep -vE '^appVersion:' || true
            )
            if [[ -z "$others" ]]; then
              echo "appVersion だけの変更なので release.yaml の DAG に任せる"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

  publish-chart:
    name: Publish Helm Chart
    needs: triage
    if: needs.triage.outputs.run == 'true'
    permissions:
      contents: write
      packages: write
    uses: Soli0222/shared-workflows/.github/workflows/publish-chart.yaml@75c1e8b572ce9ea8ad611d68232cb922a19acdeb
    with:
      api-versions: monitoring.coreos.com/v1
