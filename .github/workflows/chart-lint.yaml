name: Lint Helm chart

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart-lint.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHART_DIR: charts/note-tweet-connector
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: helm lint
        run: helm lint --strict "${CHART_DIR}"

      - name: helm template (default values)
        run: |
          set -euo pipefail
          helm template release-test "${CHART_DIR}" \
            --namespace lint \
            --api-versions monitoring.coreos.com/v1 \
            > /dev/null

      - name: helm template (as a packaged release, verify appVersion injection)
        run: |
          set -euo pipefail
          helm package "${CHART_DIR}" --version 9.9.9 --app-version 9.9.9 --destination /tmp/pkg
          helm template release-test /tmp/pkg/*.tgz \
            --namespace lint \
            --api-versions monitoring.coreos.com/v1 \
            | grep -q '9\.9\.9'
