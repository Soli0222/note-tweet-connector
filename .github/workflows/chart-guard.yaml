name: Chart Guard

# chart の変更内容と version の上げ方が噛み合っているかを PR で検査する。
# pke はこの約束を信頼して自作 chart の patch を automerge する。

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart-guard.yaml'

jobs:
  chart-guard:
    name: Guard chart version
    permissions:
      contents: read
    uses: Soli0222/shared-workflows/.github/workflows/chart-guard.yaml@75c1e8b572ce9ea8ad611d68232cb922a19acdeb
